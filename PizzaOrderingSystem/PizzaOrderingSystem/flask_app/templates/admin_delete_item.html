<div style="
    max-width:700px;
    margin:0 auto;
    text-align:center;
    font-family:'Anton', sans-serif;
">

    <h1 style="font-size:48px; font-weight:700; margin-bottom:20px; color:#d32f2f;">
        Delete Menu Item
    </h1>

    <p style="font-size:24px; margin-bottom:20px;">
        Are you sure you want to delete:
    </p>

    <h2 style="font-size:36px; margin-bottom:10px;">
        {{ item.name }}
    </h2>

    <p style="font-size:20px; margin-bottom:30px;">
        Category: {{ item.category }}<br>
        Price: ${{ "%.2f"|format(item.price) }}<br>
        Active: {{ "Yes" if item.active else "No" }}
    </p>

    <form method="POST">
        <button type="submit" style="
            background:#d32f2f;
            color:white;
            padding:14px 24px;
            border:none;
            border-radius:10px;
            font-size:24px;
            cursor:pointer;
            margin-right:15px;
        ">
            Yes, Delete
        </button>

        <a href="/manage_menu" style="
            background:#1976d2;
            color:white;
            padding:14px 24px;
            border-radius:10px;
            text-decoration:none;
            font-size:24px;
        ">
            Cancel
        </a>
    </form>

    <div style="margin-top:30px;">
        <img src="{{ url_for('static', filename='ColoradoPizzaLogo.png') }}"
             alt="Colorado Pizza Logo"
             style="width:300px; height:auto;">
    </div>

</div>
