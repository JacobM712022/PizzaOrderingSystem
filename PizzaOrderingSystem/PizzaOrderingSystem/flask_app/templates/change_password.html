<div style="
    max-width:700px;
    margin:0 auto;
    text-align:center;
    font-family:'Anton', sans-serif;
">

    <h1 style="
        font-size:48px;
        font-weight:700;
        margin-bottom:20px;
    ">
        Change Password
    </h1>

    <form action="/change_password" method="POST" style="text-align:left; font-size:20px;">

        <label>Current Password:</label><br>
        <input type="password" name="current_password" required
               style="width:100%; padding:10px; border-radius:6px; border:2px solid #0D47A1; font-size:18px;"><br><br>

        <label>New Password:</label><br>
        <input type="password" name="new_password" required
               style="width:100%; padding:10px; border-radius:6px; border:2px solid #0D47A1; font-size:18px;"><br><br>

        <label>Confirm New Password:</label><br>
        <input type="password" name="confirm_password" required
               style="width:100%; padding:10px; border-radius:6px; border:2px solid #0D47A1; font-size:18px;"><br><br>

        <button type="submit" style="
            width:100%;
            background:#388e3c;
            color:white;
            padding:14px;
            border:none;
            border-radius:8px;
            font-size:24px;
            cursor:pointer;
            margin-top:10px;
        ">
            Update Password
        </button>
    </form>

    <div style="margin-top:25px;">
        <a href="/profile" style="
            display:inline-block;
            background:#d32f2f;
            color:white;
            padding:12px 24px;
            border-radius:10px;
            text-decoration:none;
            font-size:22px;
        ">
            Cancel
        </a>
    </div>

    <div style="margin-top:30px;">
        <img src="{{ url_for('static', filename='ColoradoPizzaLogo.png') }}"
             alt="Colorado Pizza Logo"
             style="width:300px; height:auto;">
    </div>

</div>
