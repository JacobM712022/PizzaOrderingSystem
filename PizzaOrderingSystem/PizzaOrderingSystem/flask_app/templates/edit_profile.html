<div style="
    max-width:700px;
    margin:0 auto;
    text-align:center;
    font-family:'Anton', sans-serif;
">

    <h1 style="
        font-size:48px;
        font-weight:700;
        margin-bottom:20px;
    ">
        Edit Profile
    </h1>

    <form action="/edit_profile" method="POST" style="text-align:left; font-size:20px;">

        <label>Username:</label><br>
        <input type="text" name="username" value="{{ user.username }}" required
               style="width:100%; padding:10px; border-radius:6px; border:2px solid #0D47A1; font-size:18px;"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" value="{{ user.email }}" required
               style="width:100%; padding:10px; border-radius:6px; border:2px solid #0D47A1; font-size:18px;"><br><br>

        <label>First Name:</label><br>
        <input type="text" name="first_name" value="{{ user.first_name }}"
               style="width:100%; padding:10px; border-radius:6px; border:2px solid #0D47A1; font-size:18px;"><br><br>

        <label>Last Name:</label><br>
        <input type="text" name="last_name" value="{{ user.last_name }}"
               style="width:100%; padding:10px; border-radius:6px; border:2px solid #0D47A1; font-size:18px;"><br><br>

        <h3 style="margin-top:25px; font-size:26px;">Address</h3>

        <label>Street:</label><br>
        <input type="text" name="street" value="{{ user.street }}"
               style="width:100%; padding:10px; border-radius:6px; border:2px solid #0D47A1; font-size:18px;"><br><br>

        <label>City:</label><br>
        <input type="text" name="city" value="{{ user.city }}"
               style="width:100%; padding:10px; border-radius:6px; border:2px solid #0D47A1; font-size:18px;"><br><br>

        <label>State:</label><br>
        <input type="text" name="state" value="{{ user.state }}"
               style="width:100%; padding:10px; border-radius:6px; border:2px solid #0D47A1; font-size:18px;"><br><br>

        <label>Zip Code:</label><br>
        <input type="text" name="zip" value="{{ user.zip }}"
               style="width:100%; padding:10px; border-radius:6px; border:2px solid #0D47A1; font-size:18px;"><br><br>

        <button type="submit" style="
            width:100%;
            background:#388e3c;
            color:white;
            padding:14px;
            border:none;
            border-radius:8px;
            font-size:24px;
            cursor:pointer;
            margin-top:10px;
        ">
            Save Changes
        </button>
    </form>

    <div style="margin-top:25px;">
        <a href="/profile" style="
            display:inline-block;
            background:#d32f2f;
            color:white;
            padding:12px 24px;
            border-radius:10px;
            text-decoration:none;
            font-size:22px;
        ">
            Cancel
        </a>
    </div>

    <div style="margin-top:30px;">
        <img src="{{ url_for('static', filename='ColoradoPizzaLogo.png') }}"
             alt="Colorado Pizza Logo"
             style="width:300px; height:auto;">
    </div>

</div>
