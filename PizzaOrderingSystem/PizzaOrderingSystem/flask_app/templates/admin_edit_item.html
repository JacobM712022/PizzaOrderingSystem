<div style="
    max-width:700px;
    margin:0 auto;
    text-align:center;
    font-family:'Anton', sans-serif;
">

    <h1 style="font-size:48px; font-weight:700; margin-bottom:20px;">
        Edit Menu Item
    </h1>

    <form method="POST" style="text-align:left; font-size:20px;">

        <label>Name:</label><br>
        <input type="text" name="name" value="{{ item.name }}" required
               style="width:100%; padding:10px; border-radius:6px; border:2px solid #0D47A1; font-size:18px;"><br><br>

        <label>Description:</label><br>
        <textarea name="description" required
                  style="width:100%; padding:10px; border-radius:6px; border:2px solid #0D47A1; font-size:18px; height:100px;">{{ item.description }}</textarea><br><br>

        <label>Category:</label><br>
        <select name="category" required
                style="width:100%; padding:10px; border-radius:6px; border:2px solid #0D47A1; font-size:18px;">
            <option value="pizza"   {% if item.category == "pizza" %}selected{% endif %}>Pizza</option>
            <option value="sides"   {% if item.category == "sides" %}selected{% endif %}>Sides</option>
            <option value="dessert" {% if item.category == "dessert" %}selected{% endif %}>Dessert</option>
            <option value="drinks"  {% if item.category == "drinks" %}selected{% endif %}>Drinks</option>
        </select>
        <br><br>
        
        <label>Price:</label><br>
        <input type="number" step="0.01" name="price" value="{{ item.price }}" required
               style="width:100%; padding:10px; border-radius:6px; border:2px solid #0D47A1; font-size:18px;"><br><br>

        <label>Active:</label><br>
        <select name="active" style="
            width:100%;
            padding:10px;
            border-radius:6px;
            border:2px solid #0D47A1;
            font-size:18px;
        ">
            <option value="yes" {% if item.active %}selected{% endif %}>Yes</option>
            <option value="no" {% if not item.active %}selected{% endif %}>No</option>
        </select><br><br>

        <button type="submit" style="
            width:100%;
            background:#1976d2;
            color:white;
            padding:14px;
            border:none;
            border-radius:8px;
            font-size:24px;
            cursor:pointer;
            margin-top:10px;
        ">
            Save Changes
        </button>
    </form>

    <div style="margin-top:25px;">
        <a href="/manage_menu" style="
            display:inline-block;
            background:#d32f2f;
            color:white;
            padding:12px 24px;
            border-radius:10px;
            text-decoration:none;
            font-size:22px;
        ">
            Cancel
        </a>
    </div>

    <div style="margin-top:30px;">
        <img src="{{ url_for('static', filename='ColoradoPizzaLogo.png') }}"
             alt="Colorado Pizza Logo"
             style="width:300px; height:auto;">
    </div>

</div>
