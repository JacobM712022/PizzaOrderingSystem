<div style="
    background: #0D47A1;
    padding: 10px 15px;
    border-radius: 6px;
    margin-bottom: 15px;
    color: white;
    text-align: left;
">
    {% if session.get("user") %}
        Welcome, {{ session.get("user") }} |
        <a href="/logout" style="color:white; text-decoration:none;">Logout</a>
    {% else %}
        <a href="/login" style="color:white; text-decoration:none; margin-right:10px;">Login</a>
        <a href="/create_account" style="color:white; text-decoration:none;">Create Account</a>
    {% endif %}
</div>

<h1>Welcome to Colorado Pizza!</h1>
<div style="text-align: left; margin-top: 20px;">
    <img src="{{ url_for('static', filename='ColoradoPizzaLogo.png') }}" 
         alt="Colorado Pizza Logo"
         style="width: 400px; height: auto;">
</div>
